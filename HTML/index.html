<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寝音メト--欢迎来到寝音的网站</title>
    <style>
        @font-face {
            font-family: "Myfont";
            src: url("../font/fusion-pixel-12px-monospaced-ja.ttf");
            font-weight: bold;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Myfont", sans-serif;
            background-color: #838383;
            background-image: url("../image/zhishaoyuBG.png");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: -1;
        }

        .title {
            color: #ffffff;
            text-align: center;
            font-size: 70px;
            font-family: "Myfont";
            text-shadow: 0 0 10px #ffffff;
            margin: 0;
            padding-top: 20px;
        }

        .main-card {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .content-wrapper {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 60px;
            background: rgba(73, 73, 73, 0.85);
            padding: 40px;
        }

        .img1 {
            margin-left: 40px;
            width: 350px;
            height: 750px;
            display: block;
        }

        .right-section {
            flex: 1;
            min-width: 300px;
        }

        .sheding {
            width: 518px;
            height: 238px;
            position: relative;
            display: inline-block;
            transition: 0.2s;
            margin-bottom: 30px;
        }

        .ocimg {
            width: 518px;
            height: 238px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: 0.2s;
            display: block;
        }

        .sheding:hover {
            outline: 2px solid white;
        }

        .design-text {
            position: absolute;
            bottom: 8px;
            left: 8px;
            color: white;
            font-size: 64px;
            cursor: default;
        }

        .description {
            color: #ccc;
            line-height: 1.6;
            margin-top: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
        }

        .description h3 {
            color: #7e7e7e;
            margin-bottom: 10px;
        }

        .hello {
            margin: 40px auto 0;
            max-width: 1000px;
            width: 90%;
            height: auto;
            display: block;
        }

        @media (max-width: 1024px) {
            .content-wrapper {
                flex-direction: column;
                align-items: center;
                padding: 30px;
            }

            .img1 {
                margin-left: 0;
                width: 100%;
                max-width: 400px;
                height: auto;
            }

            .title {
                font-size: 50px;
            }

            .setting-text {
                font-size: 28px;
            }

            .hello {
                margin-left: auto;
                margin-right: auto;
                width: 90%;
                height: auto;
            }
        }

        @media (max-width: 768px) {
            body {
                background-attachment: scroll;
            }

            .title {
                font-size: 30px;
            }

            .main-card {
                margin: 20px auto;
                padding: 0 10px;
            }

            .content-wrapper {
                padding: 12px;
                gap: 20px;
            }

            .setting-text {
                font-size: 24px;
            }

            .hello {
                margin-top: 20px;
            }

            .img1 {
                max-width: 100%;
            }

            .sheding {
                width: 100%;
                height: auto;
            }

            .ocimg {
                width: 100%;
                height: auto;
            }

            .design-text {
                font-size: 32px;
            }

            .description {
                padding: 14px;
            }

            .downbutton {
                margin-top: 20px;
            }

            .downimg {
                max-width: 360px;
            }

            .download-text {
                font-size: 20px;
            }

            .checktermsbutton {
                padding: 14px;
                font-size: 20px;
            }

            .dl01 {
                padding: 14px;
            }

            .dl01 h3 {
                font-size: 20px;
            }

            .dl01 p {
                font-size: 15px;
            }
        }

        .downbutton {
            margin-top: 30px;
            position: relative;
            width: 100%;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            text-align: center;
        }

        .downimg {
            width: 100%;
            height: auto;
            object-fit: contain;
            display: block;
        }

        .download-text {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            transform: translateY(-50%);
            padding-right: 15%;
            color: #ffffff;
            font-family: "Myfont", sans-serif;
            font-size: 44px;
            text-align: center;
            line-height: 1.2;
        }

        .downbutton:hover {
            outline: 2px solid white;
        }

        .downbutton:active {
            outline: 2px solid white;
        }

        .checktermsbutton {
            font-family: "Myfont", sans-serif;
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin-top: 15px;
            padding: 20px;
            background: #0f0f0f;
            color: #ffffff;
            border: none;
            cursor: pointer;
            font-size: 24px;
            transition: 0.2s;
        }

        .checktermsbutton:hover {
            background: #1a1a1a;
            outline: 2px solid white;
        }

        .checktermsbutton:active {
            background: #000000;
            color: #cccccc;
        }

        .dl01 {
            font-family: "Myfont", sans-serif;
            color: #ffffff;
            background-color: #0f0f0f;
            text-align: center;
            padding: 20px;
            margin-top: 15px;
        }

        .dl01 h3 {
            font-family: "Myfont", sans-serif;
            color: #ffffff;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .dl01 p {
            font-family: "Myfont", sans-serif;
            color: #ffffff;
            font-size: 18px;
        }
    </style>
</head>

        // ========== 页面标题字典 ==========
        const pageTitles = {
            zh: "寝音メト--欢迎来到寝音的网站",
            en: "Neoto Meto--Welcome to Neoto's Website",
            ja: "寝音メト--寝音のサイトへようこそ"

        // ========== 切换语言 ==========
        function setLanguage(lang) {
            // 更新所有 data-i18n 元素
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang] && i18n[lang][key]) {
                    el.textContent = i18n[lang][key];
                }
            });

            // 更新页面标题
            document.title = pageTitles[lang];

            // 更新 html lang 属性
            document.documentElement.lang = lang === 'ja' ? 'ja' : lang === 'en' ? 'en' : 'zh-CN';

            // 保存到 localStorage
            localStorage.setItem('lang', lang);
        }

        // ========== 初始化 ==========
        // 读取保存的语言，默认为中文
        const savedLang = localStorage.getItem('lang') || 'zh';
        setLanguage(savedLang);

        // 绑定语言切换按钮
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', function (e) {
                e.preventDefault();
                const lang = this.getAttribute('data-lang');
                setLanguage(lang);
            });
        });
    </script>
